<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Campus Placement Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-wrapper {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
            position: relative;
            z-index: 1;
        }
        .auth-card {
            width: 100%;
            max-width: 560px;
            padding: 2.5rem;
        }
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .role-btn {
            padding: 0.75rem;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: center;
        }
        .role-btn.active {
            background: var(--accent-cyan-dim);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>
    <canvas id="canvas-constellation"></canvas>

    <header class="top-nav">
        <a href="/" class="brand-badge">
            <div class="brand-icon">🎓</div>
            <div>
                <div class="brand-title">CAMPUS CONNECT</div>
                <div class="brand-subtitle">Placement & Internship Portal</div>
            </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">
                <span class="theme-toggle-icon">☀️</span><span>Light Mode</span>
            </button>
            <a href="/login.html" class="btn btn-glass btn-sm">Already Registered? Sign In</a>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="glass-panel auth-card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h1 style="font-family: var(--font-display); font-size: 1.85rem; font-weight: 700;">Create Portal Account</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Choose your account type to get started</p>
            </div>

            <!-- Role Selection -->
            <div class="role-selector">
                <div id="btnStudentRole" class="role-btn active" onclick="setRole('STUDENT')">👨‍🎓 Student Candidate</div>
                <div id="btnRecruiterRole" class="role-btn" onclick="setRole('RECRUITER')">🏢 Corporate Recruiter</div>
            </div>

            <form id="registerForm">
                <input type="hidden" id="role" name="role" value="STUDENT">

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-input" placeholder="e.g. Saurabh Verma" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" placeholder="e.g. saurabh@campus.edu" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="phone" class="form-input" placeholder="+91 98765 43210" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Account Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Minimum 6 characters" required>
                </div>

                <!-- Student Specific Fields -->
                <div id="studentFields">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">University Roll Number</label>
                            <input type="text" id="rollNumber" class="form-input" placeholder="e.g. 22CS105">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Cumulative CGPA</label>
                            <input type="number" step="0.01" min="0" max="10" id="cgpa" class="form-input" placeholder="e.g. 8.75">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Academic Department / Branch</label>
                            <select id="branch" class="form-select">
                                <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Electronics & Communication">Electronics & Communication</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Grad Year</label>
                            <input type="number" id="gradYear" class="form-input" value="2026">
                        </div>
                    </div>
                </div>

                <!-- Recruiter Specific Fields -->
                <div id="recruiterFields" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">Company Name</label>
                        <input type="text" id="companyName" class="form-input" placeholder="e.g. Atlassian India">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Industry Domain</label>
                            <input type="text" id="industry" class="form-input" placeholder="e.g. Enterprise Cloud">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Work Location</label>
                            <input type="text" id="location" class="form-input" placeholder="e.g. Bengaluru">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Company Careers Website</label>
                        <input type="url" id="website" class="form-input" placeholder="https://careers.company.com">
                    </div>
                </div>

                <button type="submit" class="btn btn-cyan" style="width: 100%; padding: 0.85rem; margin-top: 1rem;">
                    Complete Registration →
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
                Already have an account? <a href="/login.html" style="color: var(--accent-cyan); text-decoration: none; font-weight: 600;">Sign In</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function setRole(role) {
            document.getElementById('role').value = role;
            if (role === 'STUDENT') {
                document.getElementById('btnStudentRole').classList.add('active');
                document.getElementById('btnRecruiterRole').classList.remove('active');
                document.getElementById('studentFields').style.display = 'block';
                document.getElementById('recruiterFields').style.display = 'none';
            } else {
                document.getElementById('btnStudentRole').classList.remove('active');
                document.getElementById('btnRecruiterRole').classList.add('active');
                document.getElementById('studentFields').style.display = 'none';
                document.getElementById('recruiterFields').style.display = 'block';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            const formData = new URLSearchParams();
            formData.append('role', role);
            formData.append('fullName', fullName);
            formData.append('email', email);
            formData.append('phone', phone);
            formData.append('password', password);

            if (role === 'STUDENT') {
                formData.append('rollNumber', document.getElementById('rollNumber').value || '22CS999');
                formData.append('cgpa', document.getElementById('cgpa').value || '8.0');
                formData.append('branch', document.getElementById('branch').value);
                formData.append('gradYear', document.getElementById('gradYear').value || '2026');
            } else {
                formData.append('companyName', document.getElementById('companyName').value || 'Enterprise Tech');
                formData.append('industry', document.getElementById('industry').value || 'Information Technology');
                formData.append('location', document.getElementById('location').value || 'Bengaluru');
                formData.append('website', document.getElementById('website').value || 'https://example.com');
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Registration successful! Redirecting to dashboard...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 600);
                } else {
                    showToast(data.message || 'Registration failed', 'error');
                }
            } catch (err) {
                showToast('Registration error: ' + err.message, 'error');
            }
        });
    </script>
</body>
</html>
